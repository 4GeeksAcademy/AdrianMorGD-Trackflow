[project]
name = "adrianmorgd-trackflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AdrianMorGD", email = "adrianmorgd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.160.0",
    "PyJWT[crypto]>=2.10.1",
    "bcrypt>=4.0.1",
    "libpass>=1.9.3",
    "tinydb>=4.8.2",
]

[project.scripts]
adrianmorgd-trackflow = "adrianmorgd_trackflow:main"
seed = "adrianmorgd_trackflow.seed:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
